name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The release script already cross-compiles all six targets with
      # CGO_ENABLED=0. Running it here is build-only — nothing is uploaded —
      # and it keeps the release path itself from rotting.
      - run: scripts/build.sh

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stdlib python3 only, no pip install.
      - run: python3 test_pipeline.py
        working-directory: dataset
