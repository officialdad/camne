name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `go vet` (in the test job) + staticcheck is the whole lint stack.
      # No .golangci.yml: it bundles ~50 linters whose defaults are not this
      # repo's bar — CLAUDE.md is — and it is one more thing to pin and silence.
      # Pinned, never @latest, so a new staticcheck release cannot redden an
      # unrelated PR. `go run <pkg>@<version>` builds in a temp module, so
      # staticcheck never lands in go.mod/go.sum.
      # ST1005 stays ON: the Malay error strings are already lowercase and
      # unpunctuated, so it fires on nothing. If it ever fights a user-facing
      # Malay string, add `-ST1005` to a staticcheck.conf — do not reword the
      # Malay to satisfy a linter.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The release script already cross-compiles all six targets with
      # CGO_ENABLED=0. Running it here is build-only — nothing is uploaded —
      # and it keeps the release path itself from rotting.
      - run: scripts/build.sh

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stdlib python3 only, no pip install.
      - run: python3 test_pipeline.py
        working-directory: dataset
